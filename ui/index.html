<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quran Video Maker</title>
<link rel="stylesheet" href="/ui/app.css">
<script>window.QVM_TOKEN = "__TOKEN__";</script>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">ق</div>
      <div>
        <b>Quran Video Maker</b>
        <a href="#" class="credit" id="credit" title="Check out @zizorecites on TikTok">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.6 5.8a4.3 4.3 0 0 1-1-2.8h-3.1v12.4a2.6 2.6 0 1 1-2.6-2.6c.3 0 .5 0 .8.1V9.7a5.8 5.8 0 0 0-.8-.1 5.7 5.7 0 1 0 5.7 5.7V9a7.3 7.3 0 0 0 4.3 1.4V7.3a4.3 4.3 0 0 1-3.3-1.5z"/></svg>
          by @zizorecites</a>
      </div>
    </div>
    <nav>
      <a class="nav" data-view="make"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4-2.5z" class="fill"/></svg>Make videos<span class="badge" id="nav-running" hidden></span></a>
      <a class="nav" data-view="finished"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg>Finished videos</a>
      <a class="nav" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Settings</a>
    </nav>
    <div class="foot" id="foot">Everything runs on this computer.<br>Nothing gets uploaded.</div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<script src="/ui/app.js"></script>
</body>
</html>
